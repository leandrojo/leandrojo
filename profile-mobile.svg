<title id="title">Leandro Araújo — Senior Software Engineer</title>
<desc id="desc">Leandro Araújo. Senior Software Engineer focused on AI agents and backend systems. Building since 2011. Stateful agents, tool integration, observability and workflows with human review. TypeScript, Node.js, React Native, AWS, GCP, Azure and Python for OCR. First employee at meutudo; built its Android and iOS app. Experience with Boticário, Sabesp and a US healthtech. Brazil, UTC-3, remote.</desc>
