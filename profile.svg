<title id="title">Leandro Araújo — Senior Software Engineer</title>
<desc id="desc">AI agents and backend systems, with a product mindset. Building software since 2011. Stateful agents, tool integration, observability and human review. TypeScript, Node.js, React Native, AWS, GCP, Azure and Python for OCR. First employee at meutudo; built its Android and iOS app. Also worked on mobile products for Boticário and Sabesp, and remotely for a US healthtech. Brazil, UTC-3.</desc>
